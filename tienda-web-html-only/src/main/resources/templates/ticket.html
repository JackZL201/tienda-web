<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    .ticket{max-width:420px;margin:auto;border:1px dashed #aaa;padding:16px}
    .monospace{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}
    .totals td{font-weight:700}
  </style>
</head>
<body class="container py-3">
  <div class="ticket">
    <div class="d-flex align-items-center gap-2 mb-2">
      <img src="/img/logo.png" style="height:40px">
      <h2 class="h5 m-0">Ticket de compra</h2>
    </div>
    <table class="table table-sm monospace">
      <thead><tr><th>Producto</th><th class="text-end">Cant</th><th class="text-end">Importe</th></tr></thead>
      <tbody>
      <tr th:each="it: ${items}">
        <td th:text="${it.producto.nombre}"></td>
        <td class="text-end" th:text="${it.cantidad}"></td>
        <td class="text-end" th:text="${#numbers.formatCurrency(it.importe)}"></td>
      </tr>
      </tbody>
      <tfoot>
        <tr><td colspan="2" class="text-end">Subtotal</td><td class="text-end" th:text="${#numbers.formatCurrency(subtotal)}"></td></tr>
        <tr><td colspan="2" class="text-end">Descuento (10%)</td><td class="text-end" th:text="${#numbers.formatCurrency(descuento)}"></td></tr>
        <tr><td colspan="2" class="text-end">IVA (16%)</td><td class="text-end" th:text="${#numbers.formatCurrency(iva)}"></td></tr>
        <tr class="totals"><td colspan="2" class="text-end">TOTAL</td><td class="text-end" th:text="${#numbers.formatCurrency(total)}"></td></tr>
      </tfoot>
    </table>
    <div class="text-center text-muted small">Gracias por su compra</div>
  </div>
</body>
</html>
